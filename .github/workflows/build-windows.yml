name: Build Windows Installer & Portable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências do Projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest

    - name: Executar Testes Automatizados
      run: |
        pytest -v

    - name: Compilar Executável Standalone com PyInstaller
      run: |
        python packaging/build.py

    - name: Instalar Inno Setup Compiler
      run: |
        choco install innosetup --no-progress

    - name: Compilar Instalador Windows (.exe)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss

    - name: Upload dos Artefatos de Build
      uses: actions/upload-artifact@v4
      with:
        name: VocalFlowStudio-Windows-Binaries
        path: |
          dist_installer/VocalFlowStudio_Instalador_v1.1.1.exe
          dist/VocalFlowStudio_Portatil_v1.1.1.zip

    - name: Criar Release no GitHub
      if: github.ref == 'refs/tags/v1.1.1' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v1.1.1]'))
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.1
        name: "VocalFlow Studio v1.1.1 (Windows Installer & Portátil)"
        body: |
          ## 🎙️ VocalFlow Studio v1.1.1 para Windows

          Correções para reduzir cortes e estalos no monitoramento, otimização do processamento de áudio e buffer mais estável por padrão. O desempenho depende dos dispositivos e drivers de áudio.

          ### 🚀 Opções de Instalação (Sem precisar de terminal ou Python):
          - **Instalador Oficial:** Baixe `VocalFlowStudio_Instalador_v1.1.1.exe`, dê dois cliques e siga o assistente ("Avançar, Avançar, Concluir").
          - **Versão Portátil:** Baixe `VocalFlowStudio_Portatil_v1.1.1.zip`, extraia a pasta e execute direto o `VocalFlowStudio.exe`.

          ### 🎧 Microfone Virtual (Discord e OBS):
          Para usar no Discord ou OBS Studio, baixe o [VB-Audio Virtual Cable](https://vb-audio.com/Cable/) gratuito.
        files: |
          dist_installer/VocalFlowStudio_Instalador_v1.1.1.exe
          dist/VocalFlowStudio_Portatil_v1.1.1.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
